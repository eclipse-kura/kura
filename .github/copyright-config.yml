# Enable or disable the copyright date check
bypass_year_check: false
# In the template the user can specify two variables: {years} and {holder}
# - {years} will match the copyright years (regex: `\d{4}(,\s\d{4})?`)
# - {holder} will match the copyright holder (regex: `[\w\s\.]+`)
template_java: |
  ******************************************************************************
   * Copyright (c) {years} {holder} and/or its affiliates and others
   *
   * This program and the accompanying materials are made
   * available under the terms of the Eclipse Public License 2.0
   * which is available at https://www.eclipse.org/legal/epl-2.0/
   *
   * SPDX-License-Identifier: EPL-2.0
   *
   * Contributors:
   *  {holder}
template_xml: |2
      Copyright (c) {years} {holder} and/or its affiliates and others

      This program and the accompanying materials are made
      available under the terms of the Eclipse Public License 2.0
      which is available at https://www.eclipse.org/legal/epl-2.0/

      SPDX-License-Identifier: EPL-2.0

      Contributors:
       {holder}
# Ignore specific files and paths. The syntax and semantics are the same as in the .gitignore file.
ignore:
  # third-party / native wrapper bundles (formerly the target-platform reactor)
  - kura/com.codeminders.hidapi-parent/
  - kura/log4j2-api-config/
  - kura/org.eclipse.kura.sun.misc/
  - kura/org.eclipse.soda.dk.comm-parent/
  - kura/org.moka7/
  - kura/org.usb4java/
  - kura/usb4java-javax/
  # Byte-exact snapshot fixtures compared against the marshaller output (no header allowed)
  - test/org.eclipse.kura.core.configuration.test/src/main/resources/expected_snapshot_with_description.xml
  - test/org.eclipse.kura.core.configuration.test/src/main/resources/expected_snapshot_without_description.xml
  - suppressions.xml
  - /kura/emulator/org.eclipse.kura.emulator.position/src/main/resources/*.gpx
