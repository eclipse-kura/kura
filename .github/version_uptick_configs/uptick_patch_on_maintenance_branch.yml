---
exclusions:
  - "**/.git/**/*"
  - "**/.github/**/*"
  - "**/target/**/*"
  - "**/RELEASE_INFO/**/*"
  - "**/.settings/**/*"
  - "**/.classpath"
  - "**/.project"

tasks:
  - selector:
      and:
        - release
        - not:
            artifact_id: "moquette-broker"
    actions:
      - print
      - transform_version:
        - add_patch: 1
        - snapshot: set
