name: "Release Notes automation"

on:
  workflow_dispatch:
    inputs:
        starting_commit:
          type: string
          description: Commit from which to start generating the Release Notes (non-inclusive)
          required: true
        overwrite:
          type: boolean
          description: Overwrite the content of TODO fields in generated release notes (typically needed for RC1 notes)
          required: true
          default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  main:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    steps:

    - name: Checkout ${{ github.ref }} branch in ${{ github.repository }} repository.
      uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      with:
        fetch-depth: '0'

    - name: Setup Java
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        distribution: 'temurin' # See 'Supported distributions' for available options
        java-version: '21'

    - name: Get version
      id: get-version
      run: |
        set -euo pipefail
        version="$(python3 - <<'EOF'
        import sys, xml.etree.ElementTree as ET
        version = ET.parse("pom.xml").getroot().findtext("{http://maven.apache.org/POM/4.0.0}version")
        if not version or not version.strip():
            sys.exit("::error file=pom.xml::unable to read /project/version from the root pom")
        print(version.strip())
        EOF
        )"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
      shell: bash

    - name: Check file existence
      id: check_files
      continue-on-error: true
      uses: thebinaryfelix/check-file-existence-action@436223737a098725b8d10ab1950a03efba5e6fc6 # 1.0.0
      with:
        files: './distrib/RELEASE_NOTES.txt'

    - name: Files exist
      id: get-old-text
      if: steps.check_files.outputs.exists == 'true' && github.event.inputs.overwrite == 'false'
      run: |
        awk '/Description:/ {found=1; next} /^$/ {found=0} found {print}' ./distrib/RELEASE_NOTES.txt > description.txt
        awk '/Target Environments:/ {found=1; next} /^$/ {found=0} found {print}' ./distrib/RELEASE_NOTES.txt > target-env.txt
        awk '/Known Issues:/ {found=1; next} /^$/ {found=0} found {print}' ./distrib/RELEASE_NOTES.txt > known-issues.txt
      shell: bash

    - name: Download git-changelog-command-line tool
      id: download-changelog-cli
      uses: clausnz/github-action-download-maven-artifact@bad2e2130cb9d8c86412124298e5ba22ab9cfb66 # 0.0.4
      with:
        url: 'https://repo1.maven.org'
        repository: 'maven2'
        groupId: 'se.bjurr.gitchangelog'
        artifactId: 'git-changelog-command-line'
        version: '2.5.7'
        extension: 'jar'

    - name: Generate Release Notes
      run: |
        java -jar ${{ steps.download-changelog-cli.outputs.file }} \
        -fc "${{ github.event.inputs.starting_commit }}" \
        -ex "{\"version\":\"${{ steps.get-version.outputs.version }}\"}" \
        -t .github/release_notes_template/template.hbs \
        -hhf .github/release_notes_template/helper.hbs \
        -of ./distrib/RELEASE_NOTES.txt

    - name: Files exist write description
      id: get-description
      if: steps.check_files.outputs.exists == 'true' && github.event.inputs.overwrite == 'false'
      # Only runs if all of the files exist
      run: |
          awk 'NR==FNR { desc = (desc == "" ? $0 : desc "\n" $0); next } /\[TODO\]/ && !done { sub(/\[TODO\]/, desc); done=1 } 1' description.txt done=0 ./distrib/RELEASE_NOTES.txt > tmpfile && mv tmpfile ./distrib/RELEASE_NOTES.txt
          awk 'NR==FNR { desc = (desc == "" ? $0 : desc "\n" $0); next } /\[TODO\]/ && !done { sub(/\[TODO\]/, desc); done=1 } 1' target-env.txt done=0 ./distrib/RELEASE_NOTES.txt > tmpfile && mv tmpfile ./distrib/RELEASE_NOTES.txt
          awk 'NR==FNR { desc = (desc == "" ? $0 : desc "\n" $0); next } /\[TODO\]/ && !done { sub(/\[TODO\]/, desc); done=1 } 1' known-issues.txt done=0 ./distrib/RELEASE_NOTES.txt > tmpfile && mv tmpfile ./distrib/RELEASE_NOTES.txt
      shell: bash

    - name: Files exist clean up
      id: clean-up-files
      if: steps.check_files.outputs.exists == 'true' && github.event.inputs.overwrite == 'false'
      # Only runs if all of the files exist
      run: |
        rm description.txt
        rm target-env.txt
        rm known-issues.txt

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@38e0b6e68b4c852a5500a94740f0e535e0d7ba54 # v4.2.4
      with:
        title: "chore: add Kura ${{ steps.get-version.outputs.version }} release notes"
        commit-message: "chore: add Kura ${{ steps.get-version.outputs.version }} release notes"
        body: "Automated changes by _Release Notes automation_ action: add Kura ${{ steps.get-version.outputs.version }} version release notes since commit `${{ github.event.inputs.starting_commit }}`"
        branch-suffix: timestamp
        token: ${{ secrets.BOT_GITHUB_TOKEN }}
