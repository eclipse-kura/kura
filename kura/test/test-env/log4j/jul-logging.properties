# java.util.logging configuration for the bnd integration-test runtime.
#
# Jersey / the OSGi JAX-RS whiteboard log directly via java.util.logging (not the
# log4j2 used by the Kura bundles). When the whiteboard hands Jersey the Kura REST
# resource services (and Jersey's own servlet-integration classes) for the SERVER
# runtime, Jersey's Providers.checkProviderRuntime emits a WARNING for each class
# that is not a JAX-RS provider ("does not implement any provider interfaces
# applicable in the SERVER runtime ... will be ignored"). It is harmless (the
# classes are correctly used as resources) but very noisy in the test logs.
#
# Keep the default console handler at INFO for everything else and raise only that
# Jersey logger to SEVERE so the provider-constraint warnings are not shown.
handlers = java.util.logging.ConsoleHandler
.level = INFO
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

org.glassfish.jersey.internal.inject.Providers.level = SEVERE
