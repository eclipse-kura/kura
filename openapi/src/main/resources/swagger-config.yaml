resourceClasses:
  - org.eclipse.kura.internal.rest.auth.SessionRestService
  - org.eclipse.kura.rest.system.SystemRestService
  - org.eclipse.kura.internal.rest.configuration.ConfigurationRestService
  - org.eclipse.kura.internal.rest.identity.provider.IdentityRestServiceV1
  - org.eclipse.kura.internal.rest.identity.provider.IdentityRestServiceV2
  - org.eclipse.kura.internal.rest.security.provider.SecurityRestServiceV1
  - org.eclipse.kura.internal.rest.security.provider.SecurityRestServiceV2
  - org.eclipse.kura.internal.rest.service.listing.provider.RestServiceListingProvider
  - org.eclipse.kura.internal.rest.cloudconnection.provider.CloudConnectionRestService
  - org.eclipse.kura.internal.rest.keystore.provider.KeystoreRestServiceV1
  - org.eclipse.kura.internal.rest.keystore.provider.KeystoreRestServiceV2
  - org.eclipse.kura.internal.rest.tamper.detection.TamperDetectionRestService
  - org.eclipse.kura.internal.rest.inventory.InventoryRestService
readerClass: org.eclipse.kura.openapi.KuraOpenApiReader
readAllResources: true
openAPI:
  openapi: 3.1.2
  jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/2024-11-10
  info:
    title: Eclipse Kura REST API
    version: '${project.version}'
    description: >-
      System v1, configuration v2, session v1, identity v1/v2, security v1/v2
      service listing v1, cloud connection v1, keystore v1/v2, tamper v1
      and inventory v1 APIs.
      Available endpoints depend on installed bundles and REST settings.
      Use HTTP Basic authentication when enabled, or log in through session/v1/login/password,
      retain the JSESSIONID cookie, obtain session/v1/xsrfToken, then send both the cookie and
      X-XSRF-Token on subsequent requests, including GET. Only xsrfToken is exempt from the token requirement.
      A locked session permits only xsrfToken and changePassword until the password is changed.
      Stateless client-certificate authentication and certificate session login are also supported
      on configured mutual-TLS ports with trusted client certificates and certificate-to-identity mapping.
      Certificate session login creates a cookie; obtain xsrfToken before subsequent session-authenticated requests.
      Authentication alternatives are Basic, session cookie together with XSRF token, or client certificate.
      The cookie name shown is the servlet default and can depend on the deployment.
      Missing or invalid authentication returns a 401 after the audit filter and missing permission
      a 403. Entity-less JAX-RS errors are returned as JSON Error objects regardless of Accept;
      existing error entities retain their original format.
      Protected operations require their corresponding rest.system, rest.configuration,
      rest.identity, rest.security, rest.cloudconnection, rest.keystores,
      rest.tamper.detection or rest.inventory permission; kura.admin also grants access.
      Service listing requires an authenticated principal without a specific REST role.
  servers:
    - url: /services

  security:
    - basicAuth: []
    - sessionCookie: []
      xsrfToken: []
    - clientCertificate: []
  components:
    securitySchemes:
      clientCertificate:
        type: mutualTLS
        description: Requires a configured mutual TLS port, trusted client certificates and certificate-to-identity mapping.
      basicAuth:
        type: http
        scheme: basic
        description: Enabled by auth.basic.enabled. Identities requiring a password change cannot use Basic.
      sessionCookie:
        type: apiKey
        in: cookie
        name: JSESSIONID
        description: Cookie returned by session login; requires session.management.enabled.
      xsrfToken:
        type: apiKey
        in: header
        name: X-XSRF-Token
        description: Token from session/v1/xsrfToken; required with session authentication even for GET.
    schemas:
      InventoryBundleReference:
        type: object
        required: [name]
        properties:
          name:
            type: string
            description: Bundle symbolic name.
          version:
            type: string
            description: Optional bundle version; when omitted the first matching bundle is selected.
      InventoryContainerReference:
        type: object
        required: [name, version]
        properties:
          name:
            type: string
            description: Container name.
          version:
            type: string
            description: Container image reference including tag, e.g. nginx:latest.
      InventoryImageReference:
        type: object
        required: [name, version]
        properties:
          name:
            type: string
            description: Image name.
          version:
            type: string
            description: Image tag.
      InventoryResource:
        type: object
        required: [name, version, type]
        properties:
          name:
            type: string
          version:
            type: string
          type:
            type: string
            enum: [BUNDLE, DP, RPM, DEB, DOCKER, CONTAINER_IMAGE, APK, UNKNOWN]
      InventoryBundle:
        type: object
        required: [name, version, id, state, signed]
        properties:
          name:
            type: string
          version:
            type: string
          id:
            type: integer
            format: int64
          state:
            type: string
            description: OSGi bundle state.
          signed:
            type: boolean
      BundlesSummary:
        type: object
        required: [bundles]
        properties:
          bundles:
            type: array
            items:
              $ref: '#/components/schemas/InventoryBundle'
      DeploymentPackage:
        type: object
        required: [name, version, bundles, signed]
        properties:
          name:
            type: string
          version:
            type: string
          bundles:
            type: array
            items:
              $ref: '#/components/schemas/InventoryBundle'
          signed:
            type: boolean
      DeploymentPackagesSummary:
        type: object
        required: [deploymentPackages]
        properties:
          deploymentPackages:
            type: array
            items:
              $ref: '#/components/schemas/DeploymentPackage'
      InventorySummary:
        type: object
        required: [inventory]
        properties:
          inventory:
            type: array
            items:
              $ref: '#/components/schemas/InventoryResource'
      SystemPackagesSummary:
        type: object
        required: [systemPackages]
        properties:
          systemPackages:
            type: array
            items:
              $ref: '#/components/schemas/InventoryResource'
      DockerContainerSummary:
        type: object
        required: [name, version, type, state]
        properties:
          name:
            type: string
            description: Container name.
          version:
            type: string
            description: Container image reference including tag.
          type:
            type: string
            enum: [DOCKER]
          state:
            type: string
            enum: [installed, active, uninstalled, unknown]
            description: Framework-managed lifecycle state.
      DockerContainersSummary:
        type: object
        required: [containers]
        properties:
          containers:
            type: array
            items:
              $ref: '#/components/schemas/DockerContainerSummary'
      ContainerImagesSummary:
        type: object
        required: [images]
        properties:
          images:
            type: array
            items:
              $ref: '#/components/schemas/InventoryResource'
      Error:
        type: object
        required: [message]
        properties:
          message:
            type: string
      SubtaskFailures:
        type: object
        required: [failures]
        properties:
          failures:
            type: array
            items:
              type: object
              required: [id, message]
              properties:
                id:
                  type: string
                message:
                  type: string
      ComponentConfigurationUpdate:
        allOf:
          - $ref: '#/components/schemas/ComponentConfigurationDTO'
          - type: object
            required: [pid, properties]
    responses:
      EmptySuccess:
        description: Operation completed successfully; the response body is empty.
      SessionChanged:
        description: Session replaced or invalidated; the response body is empty.
        headers:
          Set-Cookie:
            description: Updated or expired session cookie; preserve the cookie jar.
            schema:
              type: string
      BadRequest:
        description: Invalid JSON, missing required fields, invalid values or a service-level configuration error.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      Unauthenticated:
        description: Missing or invalid authentication, locked or expired session, or missing or invalid XSRF token.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
        headers:
          WWW-Authenticate:
            description: Present when the Basic authentication provider is enabled.
            schema:
              type: string
      Forbidden:
        description: Authenticated identity lacks the required permission.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
        headers:
          WWW-Authenticate:
            description: Present when the Basic authentication provider is enabled.
            schema:
              type: string
      Unauthorized:
        description: Invalid login credentials or no usable principal/session for this session operation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      KeystoreBadRequest:
        description: Malformed JSON returns a JSON Error. Missing or invalid request fields return a plain-text validation message.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
          text/plain:
            schema:
              type: string
      NotFound:
        description: Resource, snapshot or JAX-RS path not found, or container orchestration unavailable.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      Disabled:
        description: Session management or the requested login mechanism is disabled.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      InternalError:
        description: Internal service error.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      PartialFailure:
        description: One or more subtasks failed; successful changes are not rolled back. A general failure may instead contain message.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SubtaskFailures'
                - $ref: '#/components/schemas/Error'
